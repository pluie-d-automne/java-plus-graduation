server:
  # Для Gateway - конкретный порт, чтобы пользователи всегда могли обращаться к нему
  # по одному и тому же адресу
  port: 8080
spring:
  cloud:
    gateway:
      discovery:
        locator.enabled: true
        httpclient:
          connect-timeout: 90000  # 90 секунд
          response-timeout: 90s   # 90 секунд
      routes:
        - id: request_client
          uri: lb://request-service
          predicates:
            - Path=/request-client/**
        - id: user_client
          uri: lb://user-service
          predicates:
            - Path=/users/user-client/**
        - id: event_client
          uri: lb://event-service
          predicates:
            - Path=/event-client/**
        - id: core_user_service_admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: core_comment_service_admin
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**
        - id: core_event_service_admin_categories
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**
        - id: core_event_service_admin_compilations
          uri: lb://event-service
          predicates:
            - Path=/admin/compilations/**
        - id: core_event_service_admin
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
        - id: core_comment_service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**
        - id: core_event_service_categories
          uri: lb://event-service
          predicates:
            - Path=/categories/**
        - id: core_event_service_compilations
          uri: lb://event-service
          predicates:
            - Path=/compilations/**
        - id: core_event_service
          uri: lb://event-service
          predicates:
            - Path=/events/**
        - id: core_comment_service_private
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**
        - id: core_event_service_private
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**
        - id: core_request_service_private
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**

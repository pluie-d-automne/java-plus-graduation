server:
  port: 0
grpc:
  server:
    port: 0
kafka:
  properties:
    actions:
      "bootstrap.servers": "localhost:9092"
      topic: "stats.user-actions.v1"
      key_deserializer_class: "org.apache.kafka.common.serialization.StringDeserializer"
      value_deserializer_class: "ru.practicum.analyzer.kafka.UserActionDeserializer"
      group_id: "analyzer.actions.reader"
    similarities:
      "bootstrap.servers": "localhost:9092"
      topic: "stats.events-similarity.v1"
      key_deserializer_class: "org.apache.kafka.common.serialization.StringDeserializer"
      value_deserializer_class: "ru.practicum.analyzer.kafka.EventSimilarityDeserializer"
      group_id: "analyzer.similarities.reader"
spring:
  datasource:
    driverClassName: "org.postgresql.Driver"
    url: "jdbc:postgresql://pgdb-analyzer:5437/analyzer"
    username: "user"
    password: "password"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

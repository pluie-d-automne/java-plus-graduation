syntax = "proto3";

package stats.service.dashboard;

import "stats/messages/user_predictions.proto";

option java_package = "ru.practicum.ewm.stats.proto";
option java_outer_classname = "RecommendationsControllerProto";

service RecommendationsController  {
    rpc GetRecommendationsForUser (stats.message.predictions.UserPredictionsRequestProto)
        returns (stream stats.message.predictions.RecommendedEventProto);

    rpc GetSimilarEvents (stats.message.predictions.SimilarEventsRequestProto)
           returns (stream stats.message.predictions.RecommendedEventProto);

    rpc GetInteractionsCount (stats.message.predictions.InteractionsCountRequestProto)
           returns (stream stats.message.predictions.RecommendedEventProto);
}